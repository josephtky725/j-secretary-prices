name: Update PriceCatcher prices

on:
  schedule:
    - cron: '30 5 * * *'   # 1:30 PM Malaysia time, after KPDN's daily update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fallback reader (only used if a CSV file is missing)
        run: pip install --quiet pyarrow

      - name: Build the price files
        run: python build_prices.py

      - name: Publish to the "data" branch
        run: |
          cd out
          git init -q -b data
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A
          git commit -qm "PriceCatcher prices up to $(cat updated.txt)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
